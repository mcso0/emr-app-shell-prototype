name: Release Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Secrets, docs, UX copy, lint, typecheck, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run security:secrets
      - run: npm run docs:check
      - run: npm run ux-copy:check
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
