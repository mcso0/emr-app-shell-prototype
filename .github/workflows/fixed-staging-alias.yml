name: Fixed Staging Alias

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "Ready Vercel deployment URL to alias. Defaults to the staging branch alias for dry-runs."
        required: false
        type: string
      dry_run:
        description: "Validate the target and print the Vercel CLI plan without changing the alias."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: fixed-staging-alias-staging
  cancel-in-progress: false

jobs:
  update-fixed-staging-alias:
    name: Update fixed staging alias
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.deployment_status.state == 'success' &&
        github.event.deployment.ref == 'staging'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      FIXED_STAGING_ALIAS: emr-app-shell-prototype-staging-mcso0s-projects.vercel.app
      STAGING_BRANCH_ALIAS: emr-app-shell-prototype-git-staging-mcso0s-projects.vercel.app
      VERCEL_SCOPE: mcso0s-projects

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Resolve deployment URL
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOYMENT_STATUS_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          DISPATCH_DEPLOYMENT_URL: ${{ github.event.inputs.deployment_url }}
          DISPATCH_DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deployment_url="${DISPATCH_DEPLOYMENT_URL:-https://$STAGING_BRANCH_ALIAS}"
          else
            deployment_url="$DEPLOYMENT_STATUS_URL"
          fi

          if [ -z "$deployment_url" ]; then
            echo "No deployment URL was provided by the deployment_status event." >&2
            exit 1
          fi

          echo "VERCEL_DEPLOYMENT_URL=$deployment_url" >> "$GITHUB_ENV"

          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$DISPATCH_DRY_RUN" = "true" ]; then
            echo "ALIAS_SCRIPT_ARGS=--dry-run" >> "$GITHUB_ENV"
          else
            echo "ALIAS_SCRIPT_ARGS=" >> "$GITHUB_ENV"
          fi

      - name: Update alias
        env:
          VERCEL_TOKEN: ${{secrets.VERCEL_TOKEN}}
        run: node scripts/update-fixed-staging-alias.mjs $ALIAS_SCRIPT_ARGS
