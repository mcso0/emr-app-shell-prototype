# --- Headroom init provider ---
model_provider = "headroom"
openai_base_url = "http://127.0.0.1:8787/v1"

model = "gpt-5.5"
model_context_window = 400000
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
[model_providers.headroom]
name = "Headroom init proxy"
base_url = "http://127.0.0.1:8787/v1"
supports_websockets = true
# --- end Headroom init provider ---

[features]
# --- Headroom init features ---
codex_hooks = true
# --- end Headroom init features ---

[mcp_servers.clair_storybook]
url = "http://127.0.0.1:6006/mcp"
enabled = true
required = false
startup_timeout_sec = 10
tool_timeout_sec = 120
default_tools_approval_mode = "auto"
enabled_tools = [
  "list-all-documentation",
  "get-documentation",
  "get-documentation-for-story",
  "get-storybook-story-instructions",
  "preview-stories",
  "run-story-tests",
]

# Managed by LazyCodex: multi_agent_v2 is re-disabled on every Codex session start
# because enabling it fails every turn with HTTP 400 (openai/codex#26753).
# Opt out: LAZYCODEX_CONFIG_MIGRATION_DISABLED=1 (or OMO_CODEX_CONFIG_MIGRATION_DISABLED=1).
[features.multi_agent_v2]
enabled = false
