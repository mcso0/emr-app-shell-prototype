<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLAiR 차트 시안 QA 비교</title>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; min-height: 100%; background: #17171a; color: #fff; font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { display: grid; grid-template-columns: 1fr 1fr; }
      figure { position: relative; margin: 0; overflow: hidden; background: #fff; outline: 1px solid rgba(255,255,255,.22); outline-offset: -1px; }
      img { display: block; width: 100%; height: auto; outline: 1px solid rgba(255,255,255,.1); outline-offset: -1px; }
      figcaption { position: absolute; left: 10px; top: 10px; min-height: 28px; display: flex; align-items: center; padding: 0 10px; border-radius: 7px; background: rgba(23,23,26,.88); box-shadow: 0 2px 12px rgba(0,0,0,.22); font-size: 11px; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <figure><img src="source-current-chart-1440.png" alt="현재 차트 화면" /><figcaption>Source · 현재 차트</figcaption></figure>
      <figure><img src="qa-concept-a-1440.png" alt="집중 기록 시안" /><figcaption>A · 집중 기록</figcaption></figure>
      <figure><img src="qa-concept-b-1440.png" alt="커맨드 차트 시안" /><figcaption>B · 커맨드 차트</figcaption></figure>
      <figure><img src="qa-concept-c-1440.png" alt="증상 템플릿 시안" /><figcaption>C · 증상 템플릿</figcaption></figure>
    </main>
  </body>
</html>
