<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CLAiR Docs Planning Wireframe</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #09090b;
        --surface: #0c0c0f;
        --surface-raised: #111113;
        --surface-active: #18181b;
        --border: #27272a;
        --border-soft: #1f1f23;
        --text: #fafafa;
        --muted: #a1a1aa;
        --faint: #71717a;
        --accent: #f4d46b;
        --header-height: 56px;
        --radius: 8px;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      [data-theme="light"] {
        color-scheme: light;
        --background: #ffffff;
        --surface: #ffffff;
        --surface-raised: #fafafa;
        --surface-active: #f4f4f5;
        --border: #d4d4d8;
        --border-soft: #e4e4e7;
        --text: #09090b;
        --muted: #52525b;
        --faint: #71717a;
        --accent: #987a19;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--background);
        color: var(--text);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      button {
        font: inherit;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-rows: var(--header-height) 1fr;
      }

      .topbar {
        height: var(--header-height);
        display: grid;
        grid-template-columns: minmax(180px, 280px) minmax(240px, 1fr) auto;
        align-items: center;
        gap: 24px;
        padding: 0 20px;
        border-bottom: 1px solid var(--border-soft);
        background: color-mix(in srgb, var(--background) 92%, transparent);
        position: sticky;
        top: 0;
        z-index: 20;
        backdrop-filter: blur(14px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
        font-size: 15px;
        font-weight: 700;
      }

      .logo-mark {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        background:
          linear-gradient(145deg, #fff 0 42%, transparent 43%),
          linear-gradient(35deg, transparent 0 40%, #fff 41% 68%, transparent 69%),
          #050505;
        border: 1px solid #242428;
        flex: 0 0 auto;
      }

      .area-tabs {
        display: flex;
        justify-content: center;
        gap: 8px;
      }

      .area-tab {
        height: 32px;
        min-width: 88px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 1px solid transparent;
        border-radius: var(--radius);
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }

      .area-tab[aria-selected="true"] {
        border-color: var(--border);
        background: var(--surface-active);
        color: var(--text);
      }

      .top-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }

      .search-trigger {
        width: 264px;
        height: 32px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--muted);
        padding: 0 8px 0 10px;
        font-size: 12px;
      }

      .search-copy {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }

      .search-copy svg,
      .icon-button svg {
        width: 15px;
        height: 15px;
        flex: 0 0 auto;
      }

      .kbd {
        display: inline-flex;
        align-items: center;
        height: 20px;
        padding: 0 6px;
        border: 1px solid var(--border);
        border-radius: 5px;
        color: var(--faint);
        font-size: 11px;
      }

      .icon-button {
        width: 32px;
        height: 32px;
        display: inline-grid;
        place-items: center;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--text);
        cursor: pointer;
      }

      .layout {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 280px;
        min-height: calc(100vh - var(--header-height));
      }

      .sidebar {
        border-right: 1px solid var(--border-soft);
        background: color-mix(in srgb, var(--surface) 96%, transparent);
        overflow: auto;
        padding: 20px 16px 28px;
      }

      .sidebar-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }

      .eyebrow {
        color: var(--faint);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1,
      h2,
      h3,
      h4,
      p {
        margin: 0;
      }

      .sidebar h2 {
        margin-top: 3px;
        font-size: 20px;
        line-height: 1.25;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        min-height: 22px;
        padding: 0 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--muted);
        font-size: 11px;
        white-space: nowrap;
      }

      .nav-section {
        padding-top: 16px;
        margin-top: 16px;
        border-top: 1px solid var(--border-soft);
      }

      .nav-section:first-of-type {
        padding-top: 0;
        margin-top: 0;
        border-top: 0;
      }

      .nav-section-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      .nav-section-head span:last-child {
        color: var(--faint);
        font-size: 11px;
      }

      .doc-list {
        display: grid;
        gap: 2px;
      }

      .doc-link {
        min-height: 36px;
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--radius);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.25;
        position: relative;
      }

      .doc-link strong {
        color: inherit;
        font-weight: 600;
      }

      .doc-link small {
        display: block;
        margin-top: 3px;
        color: var(--faint);
        font-size: 11px;
        line-height: 1.2;
      }

      .doc-link.is-active {
        background: var(--surface-active);
        color: var(--text);
      }

      .doc-link.is-active::before {
        content: "";
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: var(--accent);
        position: absolute;
        left: 10px;
      }

      .doc-link.is-active strong,
      .doc-link.is-active small {
        padding-left: 14px;
      }

      .doc-type {
        color: var(--faint);
        font-size: 11px;
        white-space: nowrap;
      }

      .article-scroll {
        min-width: 0;
        overflow: auto;
        background: var(--background);
      }

      .article-wrap {
        max-width: 820px;
        margin: 0 auto;
        padding: 56px 40px 96px;
      }

      .breadcrumb {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--faint);
        font-size: 13px;
        margin-bottom: 28px;
      }

      .breadcrumb strong {
        color: var(--muted);
        font-weight: 500;
      }

      .doc-title {
        font-size: clamp(42px, 5vw, 72px);
        line-height: 0.95;
        letter-spacing: 0;
        font-weight: 800;
        margin-bottom: 24px;
      }

      .source {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 44px;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-raised);
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 48px;
      }

      .source code,
      .article code {
        font-family:
          ui-monospace,
          SFMono-Regular,
          Menlo,
          Monaco,
          Consolas,
          "Liberation Mono",
          monospace;
      }

      .source code {
        color: var(--text);
        font-size: 13px;
      }

      .article {
        color: var(--muted);
        font-size: 16px;
        line-height: 1.85;
      }

      .article h2 {
        margin: 56px 0 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--border-soft);
        color: var(--text);
        font-size: 32px;
        line-height: 1.2;
      }

      .article h3 {
        margin: 34px 0 12px;
        color: var(--text);
        font-size: 22px;
        line-height: 1.3;
      }

      .article p {
        margin: 0 0 18px;
      }

      .article ul {
        margin: 8px 0 28px;
        padding-left: 22px;
      }

      .article li {
        margin: 8px 0;
      }

      .article .callout {
        margin: 24px 0;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface-raised);
      }

      .article .callout strong {
        display: block;
        color: var(--text);
        margin-bottom: 6px;
      }

      .toc {
        border-left: 1px solid var(--border-soft);
        background: color-mix(in srgb, var(--surface) 96%, transparent);
        padding: 56px 20px 32px;
        overflow: auto;
      }

      .toc-sticky {
        position: sticky;
        top: calc(var(--header-height) + 24px);
      }

      .toc h2 {
        color: var(--text);
        font-size: 13px;
        margin-bottom: 14px;
      }

      .toc-list {
        display: grid;
        gap: 2px;
        margin-bottom: 28px;
      }

      .toc-list a {
        display: block;
        padding: 5px 0;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.35;
      }

      .toc-list a.is-active {
        color: var(--text);
        font-weight: 600;
      }

      .shortcut {
        padding-top: 20px;
        border-top: 1px solid var(--border-soft);
      }

      .shortcut h3 {
        color: var(--text);
        font-size: 13px;
        margin-bottom: 12px;
      }

      .shortcut a {
        display: block;
        padding: 7px 0;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.35;
      }

      .shortcut a:hover,
      .toc-list a:hover,
      .doc-link:hover {
        color: var(--text);
      }

      @media (max-width: 1120px) {
        .layout {
          grid-template-columns: 280px minmax(0, 1fr);
        }

        .toc {
          display: none;
        }
      }

      @media (max-width: 820px) {
        .topbar {
          grid-template-columns: 1fr auto;
          gap: 12px;
          height: auto;
          min-height: var(--header-height);
          padding-top: 12px;
          padding-bottom: 0;
        }

        .area-tabs {
          order: 3;
          grid-column: 1 / -1;
          justify-content: flex-start;
          overflow: auto;
          padding-bottom: 10px;
        }

        .search-trigger {
          width: 40px;
          justify-content: center;
          padding: 0;
        }

        .search-trigger span:not(.search-copy),
        .search-copy span,
        .kbd {
          display: none;
        }

        .layout {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border-soft);
          max-height: 360px;
        }

        .article-wrap {
          padding: 40px 24px 72px;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="CLAiR Docs">
          <span class="logo-mark" aria-hidden="true"></span>
          <span>CLAiR Docs</span>
        </a>

        <nav class="area-tabs" aria-label="문서 영역">
          <button class="area-tab" type="button" data-area="planning" aria-selected="true">기획</button>
          <button class="area-tab" type="button" data-area="design" aria-selected="false">디자인</button>
          <button class="area-tab" type="button" data-area="engineering" aria-selected="false">개발</button>
        </nav>

        <div class="top-actions">
          <button class="search-trigger" type="button">
            <span class="search-copy">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
              </svg>
              <span>Search documentation...</span>
            </span>
            <span class="kbd">⌘K</span>
          </button>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="테마 전환">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2"></path>
              <path d="M12 20v2"></path>
              <path d="m4.93 4.93 1.41 1.41"></path>
              <path d="m17.66 17.66 1.41 1.41"></path>
              <path d="M2 12h2"></path>
              <path d="M20 12h2"></path>
              <path d="m6.34 17.66-1.41 1.41"></path>
              <path d="m19.07 4.93-1.41 1.41"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar" aria-label="문서 목록">
          <div class="sidebar-header">
            <div>
              <div class="eyebrow" id="sidebar-eyebrow">Planning</div>
              <h2 id="sidebar-title">기획 문서</h2>
            </div>
            <span class="badge" id="sidebar-badge">기획 selected</span>
          </div>
          <div id="sidebar-sections"></div>
        </aside>

        <section class="article-scroll">
          <article class="article-wrap">
            <div class="breadcrumb" id="breadcrumb"></div>
            <h1 class="doc-title" id="doc-title">PRD</h1>
            <div class="source">
              <span>Source:</span>
              <code id="source-path">docs/product/prd/clair-emr-saas-prd.md</code>
            </div>
            <div class="article" id="doc-body"></div>
          </article>
        </section>

        <aside class="toc" aria-label="문서 목차">
          <div class="toc-sticky">
            <h2>On this page</h2>
            <nav class="toc-list" id="toc-list"></nav>
            <div class="shortcut">
              <h3>Shortcuts</h3>
              <div id="shortcut-list"></div>
            </div>
          </div>
        </aside>
      </main>
    </div>

    <script>
      const areas = {
        planning: {
          eyebrow: "Planning",
          title: "기획 문서",
          badge: "기획 selected",
          breadcrumb: ["기획", "PRD"],
          docTitle: "PRD",
          source: "docs/product/prd/clair-emr-saas-prd.md",
          sections: [
            {
              label: "Start",
              count: "2",
              docs: [
                ["Product Docs", "index", "문서 운영 기준"],
                ["PRD", "prd", "동물병원 전용 EMR SaaS 서비스 PRD", true],
              ],
            },
            {
              label: "Feature Specs",
              count: "대표 문서",
              docs: [
                ["Auth Foundation Planning Index", "index", "인증/권한 기획 묶음"],
                ["Login Invite Onboarding Spec", "spec", "초대 기반 로그인/온보딩"],
                ["Member Role Management Spec", "spec", "구성원 역할 관리"],
                ["Reception Appointment Spec", "spec", "접수/예약/캘린더"],
                ["Hospital Profile Onboarding Spec", "spec", "병원 기본 정보"],
              ],
            },
            {
              label: "Product Scope",
              count: "4",
              docs: [
                ["SaaS Operating Map", "map", "서비스 운영 지도"],
                ["Product MVP Scope", "scope", "MVP 범위와 제외 범위"],
                ["Outpatient Workflow State Model", "state", "외래 흐름 상태 모델"],
                ["EMR Domain Entity Map", "domain", "도메인 엔티티 관계"],
              ],
            },
          ],
          toc: [
            ["PRD", "prd"],
            ["Overview", "overview"],
            ["One-line Definition", "one-line-definition"],
            ["Product Goals", "product-goals"],
            ["Background", "background"],
            ["Core Value", "core-value"],
            ["Target and Scenario", "target-and-scenario"],
            ["Success Criteria", "success-criteria"],
            ["MVP Scope Addendum", "mvp-scope-addendum"],
          ],
          shortcuts: ["Product MVP Scope", "SaaS Operating Map", "Reception Appointment Spec", "Outpatient Workflow State Model"],
          body: `
            <h2 id="overview">Overview</h2>
            <h3 id="one-line-definition">One-line Definition</h3>
            <p>동물병원 전용 EMR SaaS 서비스</p>
            <h3 id="product-goals">Product Goals</h3>
            <p>동물병원의 진료 효율성을 극대화하고, 환자 데이터의 정확도를 향상시키며, 수의사-보호자 간의 원활한 소통을 강화합니다. 또한, 병원 운영을 최적화하고, 체계적인 수의 데이터를 확보하여 AI 모델 학습에 기여함으로써 미래 지향적인 동물 의료 환경을 구축하는 것을 목표로 합니다.</p>
            <h3 id="background">Background</h3>
            <p>현재 많은 동물병원들은 노후화된 시스템, 비효율적인 업무 흐름, 분산된 의료 기록, 다양한 검사 장비와의 연동 부족, 그리고 환자 및 고객 관리의 어려움 등으로 인해 업무 생산성과 의료 서비스의 질 향상에 한계를 겪고 있습니다.</p>
            <h2 id="core-value">Core Value</h2>
            <h3 id="user-problem">User Problem</h3>
            <p>동물병원의 수의사, 간호사, 데스크 직원들은 비효율적인 업무 흐름, 파편화된 의료 기록 관리, 다양한 검사 및 영상 장비와의 연동 부족, 노후화된 시스템 및 UI로 인한 불편함, 그리고 환자 및 보호자 관리의 어려움을 겪고 있습니다.</p>
            <h3 id="solution">Solution</h3>
            <p>진료, 접수/예약, 조제/처치, 임상병리/영상 검사, 수납, 입원 등 모든 병원 업무를 유기적으로 연동하는 통합 EMR 시스템을 제공합니다.</p>
            <h2 id="target-and-scenario">Target and Scenario</h2>
            <p>데스크 직원은 보호자로부터 환자 접수 및 예약을 받고 특정 수의사에게 배정합니다. 수의사는 통합 EMR 시스템에서 환자의 SOAP 차트를 작성하고 진단, 처방, 업무 오더를 내립니다.</p>
            <h2 id="success-criteria">Success Criteria</h2>
            <ul>
              <li>월간 활성 사용자(MAU) 증가율 20% 달성</li>
              <li>진료 차트 작성 시간 평균 20% 단축</li>
              <li>오더 처리 정확도 98% 이상 유지</li>
              <li>사용자 만족도 5점 만점 중 4점 이상 달성</li>
            </ul>
            <h2 id="mvp-scope-addendum">2026-05-02 MVP Scope Realignment Addendum</h2>
            <div class="callout"><strong>MVP Scope</strong>접수/예약, 환자/보호자, 진료, 검사, 수납 흐름을 Product MVP의 중심 범위로 둔다.</div>
          `,
        },
        design: {
          eyebrow: "Design",
          title: "디자인 문서",
          badge: "디자인 selected",
          breadcrumb: ["디자인", "와이어프레임"],
          docTitle: "CLAiR Docs Wireframe",
          source: "docs/design/wireframes/clair-docs-ia-wireframe.html",
          sections: [
            {
              label: "Read First",
              count: "3",
              docs: [
                ["Design System", "system", "토큰/컴포넌트 기준"],
                ["Reference Screen Index", "index", "레퍼런스 화면 인덱스"],
                ["CLAiR Docs Wireframe", "html", "문서 뷰어 구조", true],
              ],
            },
            {
              label: "Flows",
              count: "3",
              docs: [
                ["Reception Appointment Flow", "flow", "접수/예약 UX 흐름"],
                ["Invite Onboarding Flow", "flow", "초대 수락/온보딩"],
